# Example: running immich-overflight-feed and immich-frame-mirror alongside
# an existing Immich stack, using the published Docker Hub images.
#
# Both services expect to share the immich stack's default network so they
# can reach immich-server internally (e.g. http://immich-server:2283).
# Adjust the `networks:` section to match how your Immich compose project
# names its network if you're merging this into an existing stack rather
# than running it standalone.

services:
  immich-overflight-feed:
    image: bdelima/immich-overflight-feed:latest
    container_name: immich-overflight-feed
    environment:
      IMMICH_INTERNAL_URL: ${IMMICH_INTERNAL_URL}
      IMMICH_PUBLIC_URL: ${IMMICH_PUBLIC_URL}
      ALBUM_ID: ${ALBUM_ID}
      # Prefer the bind-mounted file below over this env var: it's the
      # same master/admin Immich key immich-photo-pipeline and
      # immich-frame-mirror also need, so one shared host file (mounted
      # into all three) means rotating it is a single file overwrite
      # instead of editing three compose files. IMMICH_API_KEY_FILE below
      # wins when both are set; this var is just the fallback for anyone
      # who'd rather not use a file.
      IMMICH_API_KEY: ${IMMICH_API_KEY}
      SHARE_SLUG: ${SHARE_SLUG}
    volumes:
      # Same key as IMMICH_API_KEY above, as a file -- point this at the
      # SAME host file used by immich-frame-mirror below and by
      # immich-photo-pipeline's IMMICH_API_KEY_FILE
      # (bdelima/immich-photo-pipeline), e.g.
      # ../immich-shared-secrets/immich_admin_api_key, not three separate
      # copies of the same value.
      - ../immich-shared-secrets/immich_admin_api_key:/run/secrets/immich_api_key:ro
    ports:
      - "8095:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - default

  immich-frame-mirror:
    image: bdelima/immich-frame-mirror:latest
    container_name: immich-frame-mirror
    environment:
      IMMICH_INTERNAL_URL: ${IMMICH_INTERNAL_URL}
      # Same key/file convergence as immich-overflight-feed above -- see
      # that service's comments.
      IMMICH_API_KEY: ${IMMICH_API_KEY}
      ALBUM_ID: ${ALBUM_ID}
      SHARE_SLUG: ${SHARE_SLUG}
      FRAME_IP: ${FRAME_IP}
      FRAME_MAC: ${FRAME_MAC}
      MATTE: ${FRAME_MATTE:-none}
      CHECK_INTERVAL_SECONDS: "3600"
    volumes:
      - ./frame-mirror-data:/data
      - ../immich-shared-secrets/immich_admin_api_key:/run/secrets/immich_api_key:ro
    restart: unless-stopped
    networks:
      - default

networks:
  default:
    name: immich_default
    external: true
