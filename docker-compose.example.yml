# Example: running immich-overflight-feed and immich-frame-mirror alongside
# an existing Immich stack, using the published Docker Hub images.
#
# Both services expect to share the immich stack's default network so they
# can reach immich-server internally (e.g. http://immich-server:2283).
# Adjust the `networks:` section to match how your Immich compose project
# names its network if you're merging this into an existing stack rather
# than running it standalone.

services:
  immich-overflight-feed:
    image: bdelima/immich-overflight-feed:latest
    container_name: immich-overflight-feed
    environment:
      IMMICH_INTERNAL_URL: ${IMMICH_INTERNAL_URL}
      IMMICH_PUBLIC_URL: ${IMMICH_PUBLIC_URL}
      ALBUM_ID: ${ALBUM_ID}
      # Prefer the IMMICH_API_KEY= line in the shared secrets file below
      # over this env var: it's the same master/admin Immich key
      # immich-photo-pipeline and immich-frame-mirror also need, so one
      # shared file (mounted into all three) means rotating it is a
      # single-line edit instead of editing three compose files. The
      # file's line wins when both are set; this var is just the
      # fallback for anyone who'd rather not use the file.
      IMMICH_API_KEY: ${IMMICH_API_KEY}
      SHARE_SLUG: ${SHARE_SLUG}
    volumes:
      # The shared secrets file used across this whole Immich pipeline --
      # plain KEY=VALUE lines, one per credential. This service only
      # reads the IMMICH_API_KEY= line out of it and ignores everything
      # else (CLAUDE_CODE_OAUTH_TOKEN, IMMICH_EXTRA_API_KEY, etc. belong
      # to immich-photo-pipeline). Point this at the SAME host file
      # immich-frame-mirror below and immich-photo-pipeline's
      # SECRETS_FILE (bdelima/immich-photo-pipeline) also mount, e.g.
      # ../immich-shared-secrets/immich_secrets.env -- not three separate
      # copies of the same key.
      - ../immich-shared-secrets/immich_secrets.env:/run/secrets/immich_secrets.env:ro
    ports:
      - "8095:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - default

  immich-frame-mirror:
    image: bdelima/immich-frame-mirror:latest
    container_name: immich-frame-mirror
    environment:
      IMMICH_INTERNAL_URL: ${IMMICH_INTERNAL_URL}
      # Same key/file convergence as immich-overflight-feed above -- see
      # that service's comments.
      IMMICH_API_KEY: ${IMMICH_API_KEY}
      ALBUM_ID: ${ALBUM_ID}
      SHARE_SLUG: ${SHARE_SLUG}
      FRAME_IP: ${FRAME_IP}
      FRAME_MAC: ${FRAME_MAC}
      MATTE: ${FRAME_MATTE:-none}
      CHECK_INTERVAL_SECONDS: "3600"
    volumes:
      - ./frame-mirror-data:/data
      - ../immich-shared-secrets/immich_secrets.env:/run/secrets/immich_secrets.env:ro
    restart: unless-stopped
    networks:
      - default

networks:
  default:
    name: immich_default
    external: true
