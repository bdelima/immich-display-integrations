name: Release frame-mirror

on:
  push:
    branches: [main]
    paths:
      - 'frame-mirror/VERSION'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "value=$(cat frame-mirror/VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./frame-mirror
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            bdelima/immich-frame-mirror:${{ steps.version.outputs.value }}
            bdelima/immich-frame-mirror:latest

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: frame-mirror-v${{ steps.version.outputs.value }}
          name: frame-mirror v${{ steps.version.outputs.value }}
          generate_release_notes: true
