name: Release overflight-feed

on:
  push:
    branches: [main]
    paths:
      - 'overflight-feed/VERSION'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    outputs:
      version: ${{ steps.version.outputs.version }}
      created: ${{ steps.check.outputs.exists == 'false' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Read version from VERSION file
        id: version
        run: echo "version=$(tr -d ' \n' < overflight-feed/VERSION)" >> "$GITHUB_OUTPUT"

      - name: Skip if this version was already released
        id: check
        run: |
          if git rev-parse "overflight-feed-${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag and GitHub Release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "overflight-feed-${{ steps.version.outputs.version }}" \
            --title "overflight-feed ${{ steps.version.outputs.version }}" \
            --generate-notes

  docker:
    needs: release
    if: needs.release.outputs.created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./overflight-feed
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ needs.release.outputs.version }}
            REVISION=${{ github.sha }}
          tags: |
            bdelima/immich-overflight-feed:${{ needs.release.outputs.version }}
            bdelima/immich-overflight-feed:latest
