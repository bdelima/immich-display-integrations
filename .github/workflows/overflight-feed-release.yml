name: Release overflight-feed

on:
  push:
    branches: [main]
    paths:
      - 'overflight-feed/VERSION'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "value=$(cat overflight-feed/VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./overflight-feed
          push: true
          tags: |
            bdelima/immich-overflight-feed:${{ steps.version.outputs.value }}
            bdelima/immich-overflight-feed:latest

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: overflight-feed-v${{ steps.version.outputs.value }}
          name: overflight-feed v${{ steps.version.outputs.value }}
          generate_release_notes: true
